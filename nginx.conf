server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root /usr/share/nginx/html;
    add_header X-Robots-Tag "index, follow" always;

    # Canonical host. Traefik routes both lanos-logic.com and www.lanos-logic.com
    # here; without this the www copy of every page is served 200 and Google files
    # all ~38 of them as "Alternate page with proper canonical tag".
    if ($host ~* ^www\.) {
        return 301 https://lanos-logic.com$request_uri;
    }

    # Compress text assets (JS/CSS/JSON/XML/SVG/feeds). Images are already
    # compressed (WebP/PNG/JPG) and excluded. ~75% smaller JS bundle transfer.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/xml+rss image/svg+xml text/yaml application/yaml application/manifest+json;

    # MCP protocol (JSON-RPC 2.0)
    location = /mcp {
        proxy_pass http://lanos-mcp-server:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # REST API (OpenAPI-compatible)
    location ^~ /tools/ {
        proxy_pass http://lanos-mcp-server:8001/tools/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # Static files
    location = /robots.txt  { try_files /robots.txt =404; add_header Content-Type text/plain; }
    location = /sitemap.xml { try_files /sitemap.xml =404; add_header Content-Type application/xml; }
    location = /llms.txt    { try_files /llms.txt =404; add_header Content-Type "text/plain; charset=utf-8"; add_header X-Robots-Tag "noindex" always; }
    location = /llms-full.txt { try_files /llms-full.txt =404; add_header Content-Type "text/plain; charset=utf-8"; add_header X-Robots-Tag "noindex" always; }
    location = /llm.txt     { return 301 /llms.txt; }
    location = /openapi.yaml { try_files /openapi.yaml =404; add_header Content-Type "text/yaml; charset=utf-8"; add_header Access-Control-Allow-Origin "*"; add_header X-Robots-Tag "noindex" always; }

    # MCP Registry namespace proof. Extensionless, so without this it would be
    # served as application/octet-stream by the generic .well-known handler
    # below. Exact-match location, so it outranks that prefix.
    location = /.well-known/mcp-registry-auth {
        default_type "text/plain; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /.well-known/mcp-registry-auth =404;
    }

    # .well-known (AI/MCP/A2A discovery)
    location ^~ /.well-known/ {
        alias /usr/share/nginx/html/.well-known/;
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Long-cache fingerprinted build assets. CRA hashes these filenames
    # (e.g. /static/js/main.<hash>.js), so a new deploy ships new URLs and
    # immutable caching is safe. Regex location beats the `/` prefix match
    # below, so this is evaluated first for /static/ requests.
    location ~* ^/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Collapse duplicate URL forms onto the canonical no-slash URL that the
    # sitemap and <link rel=canonical> use. Absolute https:// on purpose — a
    # relative redirect downgrades the scheme behind Traefik (see below).
    # These are regex locations, so they outrank plain prefix matches: any
    # prefix that must survive a trailing slash (/tools/, /.well-known/) is
    # declared ^~ above so nginx skips regex evaluation for it.
    location ~ ^/(.+)/$ {
        return 301 https://lanos-logic.com/$1;
    }
    location ~ ^/(.*)index\.html$ {
        return 301 https://lanos-logic.com/$1;
    }

    # SPA fallback
    location / {
        index  index.html index.htm;
        # Serve prerendered per-route index.html directly (e.g.
        # /services/voice-ai-agents -> /services/voice-ai-agents/index.html)
        # WITHOUT a trailing-slash 301. The default `$uri/` would redirect to
        # the slash form and, behind Traefik TLS termination, downgrade the
        # scheme to http — producing an https->http->https chain. Matching the
        # non-slash canonical/sitemap URLs avoids that.
        try_files $uri $uri/index.html =404;
        # HTML (prerendered routes + SPA shell) must stay uncached so a deploy
        # goes live on the next request. Hashed assets above are immutable.
        add_header Cache-Control "no-cache" always;
        # Re-assert the server-level header: defining any add_header in this
        # location would otherwise drop the inherited X-Robots-Tag for HTML.
        add_header X-Robots-Tag "index, follow" always;
    }

    # 404.html is the prerendered SPA shell (written by deploy.sh), so React still
    # boots and renders its not-found view — but the status line is a real 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

# ---------------------------------------------------------------------------
# upwork.lanos-logic.com - Upwork Autopilot mobile control app.
#
# Static app: upwork-autopilot repo control-app/, bind-mounted read-only at
# /usr/share/nginx/upwork (NOT under html/, which deploy.sh wipes on every
# site deploy). /api/ is proxied over Tailscale to the autopilot's control-api
# on the operator's Mac, which authenticates every request with a bearer token
# and forwards actions to its local queue server. The Mac may be asleep: the
# app shows 502/504 as "Mac offline".
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=upwork_api:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upwork_auth_fail:1m rate=6r/m;

server {
    listen       80;
    listen  [::]:80;
    server_name  upwork.lanos-logic.com;

    root /usr/share/nginx/upwork;
    server_tokens off;

    # Private tool, never indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /api/ {
        limit_req zone=upwork_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://100.69.107.100:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Throttle token guessing: a 401 from upstream is re-served through a
        # tightly rate-limited internal location.
        proxy_intercept_errors on;
        error_page 401 = @upwork_unauthorized;
        error_page 502 504 = @upwork_offline;
    }

    location @upwork_unauthorized {
        limit_req zone=upwork_auth_fail burst=5 nodelay;
        limit_req_status 429;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"ok":false,"error":"unauthorized"}';
    }

    location @upwork_offline {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"ok":false,"error":"autopilot unreachable - is the Mac awake?"}';
    }

    # The service worker and shell must update on the next load.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /sw.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
